[package]
name = "node-cpal"
version = "1.0.0"
license = "ISC"
edition = "2021"
rust-version = "1.85"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
backend-jack = ["cpal/jack"]
backend-pipewire = ["cpal/pipewire"]
backend-pulseaudio = ["cpal/pulseaudio"]
backend-asio = ["cpal/asio"]
realtime = ["cpal/realtime"]
realtime-dbus = ["cpal/realtime-dbus"]
test-host = ["cpal/custom"]

[dependencies]
neon = "1"
cpal = { version = "0.18.2", default-features = false }
uuid = { version = "1.6", features = ["v4"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
once_cell = "1.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
