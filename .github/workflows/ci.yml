name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux audio development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Check Rust crate
        run: cargo check

      - name: Build native addon
        run: npm run build

  minimum-versions:
    name: Node 14 and Rust 1.85
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 14.21.3
          cache: npm

      - name: Install lockfile-compatible npm
        run: npm install --global npm@9.9.4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: minimum-versions

      - name: Install Linux audio development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run deterministic tests
        run: npm test

      - name: Build native addon
        run: npm run build
