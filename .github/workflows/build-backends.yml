name: Build and Publish Optional Backends

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to use for dry-run packages
        required: true
        default: 0.0.0-dry-run

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.backend }} on ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: jack
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
          - backend: jack
            os: macos-15
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - backend: jack
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - backend: jack
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - backend: jack
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
          - backend: pipewire
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - backend: pipewire
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - backend: pulseaudio
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
          - backend: pulseaudio
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - backend: asio
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: backend-${{ matrix.backend }}-${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install JACK build dependencies on Linux
        if: runner.os == 'Linux' && matrix.backend == 'jack'
        run: sudo apt-get install -y libjack-jackd2-dev

      - name: Install PipeWire build dependencies
        if: runner.os == 'Linux' && matrix.backend == 'pipewire'
        run: sudo apt-get install -y libpipewire-0.3-dev

      - name: Install PulseAudio build dependencies
        if: runner.os == 'Linux' && matrix.backend == 'pulseaudio'
        run: sudo apt-get install -y libpulse-dev

      - name: Install JACK build dependencies on macOS
        if: runner.os == 'macOS' && matrix.backend == 'jack'
        run: brew install jack

      - name: Install JACK build dependencies on Windows
        if: runner.os == 'Windows' && matrix.backend == 'jack'
        run: choco install jack --yes

      - name: Setup ASIO SDK and LLVM
        if: runner.os == 'Windows' && matrix.backend == 'asio'
        shell: pwsh
        run: |
          curl.exe -L -o asio.zip https://www.steinberg.net/asiosdk
          7z x -oasio asio.zip
          $sdkRoot = Get-ChildItem -Path asio -Directory | Select-Object -First 1
          Move-Item $sdkRoot.FullName asio\sdk
          choco install llvm --yes

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build optional backend
        if: matrix.backend != 'asio'
        run: npm run build -- --target ${{ matrix.target }} --features backend-${{ matrix.backend }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Build ASIO backend
        if: matrix.backend == 'asio'
        run: npm run build -- --target ${{ matrix.target }} --features backend-asio
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CPAL_ASIO_DIR: ${{ github.workspace }}\asio\sdk
          LIBCLANG_PATH: C:\Program Files\LLVM\bin

      - name: Verify native binary architecture
        run: node scripts/verify-native-binary.js index.node ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Stage native binary
        shell: bash
        run: |
          mkdir -p staged/bin/${{ matrix.platform }}-${{ matrix.arch }}
          cp index.node staged/bin/${{ matrix.platform }}-${{ matrix.arch }}/index.node

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.backend }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: staged
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.backend }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - jack
          - pipewire
          - pulseaudio
          - asio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download backend binaries
        uses: actions/download-artifact@v4
        with:
          pattern: backend-${{ matrix.backend }}-*
          path: assembled
          merge-multiple: true

      - name: Copy package-independent files
        run: |
          cp index.js assembled/
          cp index.d.ts assembled/
          cp cpal-values.js assembled/
          cp README.md assembled/
          cp packages/backend-${{ matrix.backend }}/package.json assembled/
          cp -r docs assembled/
          cp -r examples assembled/

      - name: Set package version
        working-directory: assembled
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PACKAGE_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            PACKAGE_VERSION="${DISPATCH_VERSION}"
          fi
          npm version "${PACKAGE_VERSION}" --no-git-tag-version --allow-same-version

      - name: Verify expected backend binaries
        run: |
          case "${{ matrix.backend }}" in
            jack)
              node scripts/verify-native-binary.js assembled/bin/darwin-x64/index.node darwin-x64
              node scripts/verify-native-binary.js assembled/bin/darwin-arm64/index.node darwin-arm64
              node scripts/verify-native-binary.js assembled/bin/linux-x64/index.node linux-x64
              node scripts/verify-native-binary.js assembled/bin/linux-arm64/index.node linux-arm64
              node scripts/verify-native-binary.js assembled/bin/win32-x64/index.node win32-x64
              ;;
            pipewire|pulseaudio)
              node scripts/verify-native-binary.js assembled/bin/linux-x64/index.node linux-x64
              node scripts/verify-native-binary.js assembled/bin/linux-arm64/index.node linux-arm64
              ;;
            asio)
              node scripts/verify-native-binary.js assembled/bin/win32-x64/index.node win32-x64
              ;;
          esac

      - name: Pack and dry-run publish
        run: |
          mkdir -p package
          npm pack ./assembled --ignore-scripts --pack-destination package
          npm publish ./package/*.tgz --dry-run --ignore-scripts --access public

      - name: Upload backend package
        uses: actions/upload-artifact@v4
        with:
          name: backend-package-${{ matrix.backend }}
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ matrix.backend }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - jack
          - pipewire
          - pulseaudio
          - asio
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download backend package
        uses: actions/download-artifact@v4
        with:
          name: backend-package-${{ matrix.backend }}
          path: package

      - name: Publish backend package
        run: npm publish ./package/*.tgz --ignore-scripts --access public
